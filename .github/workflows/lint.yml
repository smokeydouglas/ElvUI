name: Lua lint

on:
  push:
    paths:
      - '.github/workflows/lint.yml'
      - '**.lua'
      - '.luacheckrc'
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - '**.lua'
      - '.luacheckrc'

permissions:
  contents: read

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        run: luacheck . -q
